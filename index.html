<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>runaround</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <h1>run<span class="around">around</span></h1>
        </div>
        <div class="actions">
          <div
            class="modes"
            id="modes"
            role="group"
            aria-label="Group meanings by"
          >
            <button class="mode active" data-mode="word" aria-pressed="true">
              Word class
            </button>
            <button class="mode" data-mode="use" aria-pressed="false">
              Type of use
            </button>
            <button class="mode" data-mode="form" aria-pressed="false">
              Detailed form
            </button>
          </div>
          <button
            class="icobtn"
            id="hintBtn"
            type="button"
            title="Show the hint again"
            aria-label="Show the hint again"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5.4" />
              <circle
                cx="12"
                cy="7.5"
                r="1.15"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </button>
          <div class="tools">
            <input
              class="search"
              id="search"
              type="search"
              placeholder="Find a meaning…"
              aria-label="Find a meaning"
            />
            <button class="toolbtn" id="reset" title="Reset canvas">
              Reset view
            </button>
          </div>
        </div>
        <div class="links">
          <a
            class="ghbtn"
            href="https://github.com/smurf11k/runaround/issues/new"
            target="_blank"
            rel="noopener noreferrer"
            title="Report an issue on GitHub"
            >Report an issue</a
          >
          <a
            class="ghbtn ghicon"
            href="https://github.com/smurf11k/runaround"
            target="_blank"
            rel="noopener noreferrer"
            title="View the repository on GitHub"
            aria-label="View the repository on GitHub"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
              />
            </svg>
          </a>
        </div>
      </header>
      <main id="workspace">
        <svg id="chart" aria-label="Interactive network of meanings"></svg>
        <div class="empty" id="emptyHint">
          Drag nodes to arrange · drag the canvas to pan · scroll to zoom ·
          click a group or a sense to spotlight its family
        </div>
        <div class="legend" id="legend">
          <h3 id="legendTitle">Word class</h3>
          <div id="legendItems"></div>
          <small
            >Choose a category to filter the map — it stays on until you click
            it again.</small
          >
        </div>
        <aside class="panel" id="panel">
          <button class="close" id="closePanel">← Back to the map</button>
          <div id="panelContent"></div>
        </aside>
      </main>
    </div>
    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
